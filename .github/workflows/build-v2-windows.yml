# v2 の Python 不要版（exe）を Windows で作り、動作確認してリリースに置く。
name: build-v2-windows

on:
  push:
    branches: [claude/kaigo-insurance-automation-h38m9n]
    paths:
      - "v2/**"
      - ".github/workflows/build-v2-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

# 同時に走った古いビルドが「最新」にならないよう、1 つずつ順に実行する
concurrency:
  group: build-v2-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Stamp build number
        shell: pwsh
        run: Add-Content kaigo/__init__.py "`n__version__ = __version__[:-1] + ', build ${{ github.run_number }})'"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name kaigotool
          --collect-all playwright --collect-all pdfplumber --collect-all pdfminer --collect-all pypdfium2
          app.py

      - name: Self test (built exe, installed Edge)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\kaigotool\kaigotool.exe" -ArgumentList "--selftest", "selftest.txt", "msedge" -Wait -PassThru
          Get-Content selftest.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README_v2.md dist\kaigotool\README.md
          Copy-Item update_exe.bat dist\kaigotool\update.bat
          Compress-Archive -Path dist\kaigotool -DestinationPath kaigotool-v2-windows.zip -Force

      - name: Test update.bat (downloads the current latest release into a copy)
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "upd test"
          New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item -Recurse dist\kaigotool (Join-Path $t "kaigotool")
          Remove-Item (Join-Path $t "kaigotool\kaigotool.exe")
          $p = Start-Process cmd -ArgumentList "/c", "update.bat < NUL" -WorkingDirectory (Join-Path $t "kaigotool") -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "update.bat failed: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $t "kaigotool\kaigotool.exe"))) { throw "update.bat did not restore kaigotool.exe" }
          Write-Output "update.bat OK"

      - uses: actions/upload-artifact@v4
        with:
          name: kaigotool-v2-windows
          path: v2/kaigotool-v2-windows.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-build-${{ github.run_number }}
          name: kaigotool v2 (Windows, Python 不要) build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: v2/kaigotool-v2-windows.zip
          body: |
            Python が無い PC でも動く版です。zip を展開し、kaigotool フォルダ内の kaigotool.exe を実行してください。
            Microsoft Edge が必要です。
